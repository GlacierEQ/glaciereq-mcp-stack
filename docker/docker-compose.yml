version: '3.9'

services:
  asana-mcp:
    build:
      context: ..
      dockerfile: docker/asana-mcp.Dockerfile
    restart: unless-stopped
    environment:
      - ASANA_API_TOKEN=${ASANA_API_TOKEN}
    stdin_open: true

  github-mcp:
    build:
      context: ..
      dockerfile: docker/github-mcp.Dockerfile
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USER=${GITHUB_USER}
    stdin_open: true

  confluence-mcp:
    build:
      context: ..
      dockerfile: docker/confluence-mcp.Dockerfile
    restart: unless-stopped
    environment:
      - CONFLUENCE_API_KEY=${CONFLUENCE_API_KEY}
      - CONFLUENCE_BASE_URL=${CONFLUENCE_BASE_URL}
      - CONFLUENCE_EMAIL=${CONFLUENCE_EMAIL}
    stdin_open: true

  supabase-mcp:
    build:
      context: ..
      dockerfile: docker/supabase-mcp.Dockerfile
    restart: unless-stopped
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    stdin_open: true

  neo4j-mcp:
    build:
      context: ..
      dockerfile: docker/neo4j-mcp.Dockerfile
    restart: unless-stopped
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
    stdin_open: true
